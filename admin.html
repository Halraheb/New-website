<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>لوحة المعلم · فيزياء 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF2F7; --surface:#FFFFFF; --ink:#13203A; --muted:#5B6782; --line:#D6DDE8;
  --accent:#D98E04; --accent-ink:#3A2600; --band:#13203A; --band-ink:#F2F5FA;
  --ok:#17844B; --bad:#C23B2E;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1424; --surface:#16203A; --ink:#E9EEF7; --muted:#9AA6C0; --line:#2A3757;
  --accent:#F2B33D; --accent-ink:#2A1B00; --band:#070C18; --band-ink:#E9EEF7;
  --ok:#4CC587; --bad:#F07368; color-scheme:dark}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px}
h1,h2,h3{font-family:var(--display);margin:0}
button,input{font:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.band{background:var(--band);color:var(--band-ink)}
.band .wrap{padding-block:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.band h1{font-size:clamp(1.3rem,3vw,1.8rem)}
.band h1 span{color:var(--accent)}
.band a{color:var(--band-ink);opacity:.8;font-size:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.login{max-width:420px;margin:40px auto}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:.85rem;color:var(--muted);font-weight:500}
input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.btn{border:0;border-radius:12px;padding:10px 20px;font-weight:600;font-family:var(--display)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.msg{font-weight:600;font-size:.92rem;margin-top:10px}
.msg.bad{color:var(--bad)} .msg.ok{color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat small{display:block;color:var(--muted);font-size:.8rem}
.stat b{font-family:var(--display);font-size:1.8rem;font-variant-numeric:tabular-nums}
.stat.main{border:2px solid var(--accent)} .stat.main b{color:var(--accent)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 16px;border-radius:999px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.spacer{flex:1}
.search{max-width:240px}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;min-width:640px}
th,td{padding:10px 14px;text-align:start;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{font-size:.8rem;color:var(--muted);font-weight:600;background:var(--bg);position:sticky;top:0}
tbody tr:last-child td{border-bottom:0}
td.nm{font-weight:600;white-space:normal}
td small,.muted{color:var(--muted)}
td.ua{white-space:normal;max-width:320px;font-size:.8rem;color:var(--muted)}
.lvl{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.82rem;font-weight:600;border:1px solid currentColor}
.lvl.hi{color:var(--ok)} .lvl.mid{color:var(--accent)} .lvl.lo{color:var(--bad)}
.ev{display:inline-block;padding:1px 8px;border-radius:6px;font-size:.8rem;background:var(--bg);border:1px solid var(--line)}
.empty{padding:20px;color:var(--muted)}
footer{color:var(--muted);font-size:.8rem;padding-block:18px 28px}
@media (max-width:640px){.stats{grid-template-columns:1fr 1fr}.search{max-width:none;width:100%}}
</style>
</head>
<body>
<header class="band">
  <div class="wrap">
    <h1>لوحة المعلم · <span>فيزياء 2</span></h1>
    <a href="index.html">العودة للاختبار</a>
  </div>
</header>

<main class="wrap">
  <section id="setupMsg" class="panel login" hidden>
    <h2>قاعدة البيانات غير مفعّلة</h2>
    <p class="muted">افتح لوحة المعلم من رابط Railway، أو ضع رابط Railway في <code>config.js</code> (API_URL). الخطوات في ملف README.</p>
  </section>

  <section id="login" class="panel login" hidden>
    <h2 style="margin-bottom:14px">تسجيل دخول المعلم</h2>
    <form id="loginForm">
      <div class="field"><label for="pass">كلمة مرور المعلم</label><input id="pass" type="password" autocomplete="current-password" required dir="ltr"></div>
      <button class="btn primary" id="loginBtn">دخول</button>
      <div class="msg" id="loginMsg" aria-live="polite"></div>
    </form>
  </section>

  <section id="dash" hidden>
    <div class="stats" id="stats"></div>
    <div class="toolbar">
      <div class="tabs" role="tablist">
        <button class="tab" role="tab" data-tab="students" aria-selected="true">الطلاب</button>
        <button class="tab" role="tab" data-tab="attempts" aria-selected="false">كل المحاولات</button>
        <button class="tab" role="tab" data-tab="visits" aria-selected="false">سجل الزيارات</button>
      </div>
      <span class="spacer"></span>
      <input type="search" class="search" id="q" placeholder="بحث بالاسم">
      <button class="btn ghost" id="refresh">تحديث</button>
      <button class="btn primary" id="csv">تنزيل Excel</button>
      <button class="btn ghost" id="logout">خروج</button>
    </div>
    <p class="muted" id="info" aria-live="polite"></p>
    <div class="tablewrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
      <div class="empty" id="empty" hidden>لا توجد بيانات بعد.</div></div>
  </section>
</main>
<footer class="wrap">مدرسة الخويلدية الثانوية · إعداد الأستاذ حسن الراهب</footer>

<script src="config.js"></script>
<script>
const TOPICS={g:"الجاذبية",r:"الحركة الدورانية",m:"الاتزان والدفع والزخم",w:"الشغل والطاقة",p:"القدرة والآلات",h:"الحرارة"};
const EVENTS={visit:"دخول الموقع",start:"بدء اختبار",team_finish:"نهاية مسابقة فرق"};
const $=id=>document.getElementById(id);
const cfg=window.APP_CONFIG||{};
const onPages=/\.github\.io$/.test(location.hostname)||location.protocol==="file:";
const API=(cfg.API_URL||(onPages?"":location.origin)).replace(/\/+$/,"");
const SKEY="khuwaildiya-teacher-pass";
let session=null, data={attempts:[],visits:[]}, tab="students";

function level(p){return p>=90?"ممتاز":p>=80?"جيد جدًا":p>=65?"جيد":p>=50?"مقبول":"يحتاج دعم"}
function lvlCls(p){return p>=80?"hi":p>=50?"mid":"lo"}
function fmt(t){try{return new Date(t).toLocaleString("ar-SA-u-ca-gregory-nu-latn",{year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return t}}
function units(u){if(!Array.isArray(u)||!u.length||u.length>=6)return "كل الوحدات";return u.map(k=>TOPICS[k]||k).join("، ")}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function device(ua){ua=ua||"";return /iPhone|iPad/.test(ua)?"iPhone/iPad":/Android/.test(ua)?"Android":/Windows/.test(ua)?"Windows":/Mac OS/.test(ua)?"Mac":/CrOS/.test(ua)?"Chromebook":/Linux/.test(ua)?"Linux":"غير معروف"}

function loadSession(){try{return sessionStorage.getItem(SKEY)}catch(e){return null}}
function storeSession(v){session=v;try{v?sessionStorage.setItem(SKEY,v):sessionStorage.removeItem(SKEY)}catch(e){}}
async function fetchData(pass){
  const r=await fetch(`${API}/api/admin/data`,{headers:{Authorization:`Bearer ${pass}`}});
  if(r.status===401)throw new Error("auth");
  if(!r.ok)throw new Error(r.statusText||String(r.status));
  return r.json();
}

async function load(){
  $("info").textContent="جارٍ التحميل…";
  try{
    data=await fetchData(session);
    if(!data.attempts.length&&!data.visits.length)$("info").textContent="لا توجد بيانات بعد.";
    else $("info").textContent=`آخر تحديث: ${fmt(Date.now())}`;
    render();
  }catch(e){
    if(e.message==="auth"){storeSession(null);show();return;}
    $("info").textContent="خطأ في تحميل البيانات: "+e.message;
  }
}

function students(){
  const by=new Map();
  data.attempts.forEach(a=>{const k=String(a.name||"طالب").trim();
    const s=by.get(k)||{name:k,n:0,best:0,c:0,t:0,last:null,topics:{}};
    s.n++;s.best=Math.max(s.best,a.pct||0);s.c+=a.correct||0;s.t+=a.total||0;
    if(!s.last||a.created_at>s.last.created_at)s.last=a;
    for(const [k2,v] of Object.entries(a.by_topic||{})){const x=s.topics[k2]||(s.topics[k2]={c:0,n:0});x.c+=v.c||0;x.n+=v.n||0;}
    by.set(k,s);});
  return [...by.values()].map(s=>({...s,pct:s.t?Math.round(s.c/s.t*100):0})).sort((a,b)=>b.pct-a.pct);
}
function weakest(topics){
  let w=null;for(const [k,v] of Object.entries(topics)){if(!v.n)continue;const p=v.c/v.n;if(!w||p<w.p)w={k,p};}
  return w&&w.p<1?`${TOPICS[w.k]||w.k} (${Math.round(w.p*100)}%)`:"—";
}

function render(){
  const st=students(), A=data.attempts, V=data.visits;
  const tc=A.reduce((x,a)=>x+a.correct,0), tt=A.reduce((x,a)=>x+a.total,0);
  const visitors=new Set(V.filter(v=>v.event==="visit").map(v=>v.visitor_id)).size;
  const today=new Date().toDateString();
  $("stats").innerHTML=`<div class="stat"><small>زوار (أجهزة مختلفة)</small><b>${visitors}</b></div>
    <div class="stat"><small>زيارات اليوم</small><b>${V.filter(v=>v.event==="visit"&&new Date(v.created_at).toDateString()===today).length}</b></div>
    <div class="stat"><small>طلاب أنهوا اختبارًا</small><b>${st.length}</b> <small>${A.length} محاولة</small></div>
    <div class="stat main"><small>متوسط الإتقان</small><b>${tt?Math.round(tc/tt*100):0}%</b></div>`;
  const q=$("q").value.trim();
  const match=n=>!q||String(n||"").includes(q);
  let head="",rows="";
  if(tab==="students"){
    head=`<tr><th>الطالب</th><th>المحاولات</th><th>الإتقان</th><th>أفضل نتيجة</th><th>آخر محاولة</th><th>أضعف وحدة</th><th>المستوى</th></tr>`;
    rows=st.filter(s=>match(s.name)).map(s=>`<tr><td class="nm">${esc(s.name)}</td><td>${s.n}</td><td><b>${s.pct}%</b> <small>${s.c}/${s.t}</small></td><td>${s.best}%</td><td>${s.last.correct}/${s.last.total} <small>${fmt(s.last.created_at)}</small></td><td>${esc(weakest(s.topics))}</td><td><span class="lvl ${lvlCls(s.pct)}">${level(s.pct)}</span></td></tr>`).join("");
  }else if(tab==="attempts"){
    head=`<tr><th>الطالب</th><th>التاريخ</th><th>النتيجة</th><th>الإتقان</th><th>الوحدات</th><th>المستوى</th></tr>`;
    rows=A.filter(a=>match(a.name)).map(a=>`<tr><td class="nm">${esc(a.name)}</td><td>${fmt(a.created_at)}</td><td>${a.correct}/${a.total}</td><td><b>${a.pct}%</b></td><td style="white-space:normal">${esc(units(a.units))}</td><td><span class="lvl ${lvlCls(a.pct)}">${level(a.pct)}</span></td></tr>`).join("");
  }else{
    head=`<tr><th>الوقت</th><th>الحدث</th><th>الاسم</th><th>الجهاز</th><th>رقم الزائر</th><th>تفاصيل</th></tr>`;
    rows=V.filter(v=>match(v.name)||(!v.name&&!q)).map(v=>{
      let d="";const x=v.details||{};
      if(v.event==="start")d=v.mode==="team"?`فرق: ${esc((x.teams||[]).join("، "))}`:`فردي · ${esc(units(x.units))}`;
      if(v.event==="team_finish")d=(x.teams||[]).map(t=>`${esc(t.name)}: ${t.score}`).join(" · ");
      return `<tr><td>${fmt(v.created_at)}</td><td><span class="ev">${EVENTS[v.event]||esc(v.event)}</span></td><td class="nm">${esc(v.name||"—")}</td><td>${device(v.user_agent)} <small>${esc(v.screen||"")}</small></td><td><small dir="ltr">${esc((v.visitor_id||"").slice(0,8))}</small></td><td style="white-space:normal">${d}</td></tr>`;
    }).join("");
  }
  $("thead").innerHTML=head;$("tbody").innerHTML=rows;$("empty").hidden=!!rows;
}

function csv(){
  const e=v=>{v=String(v??"");return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const keys=Object.keys(TOPICS);let lines,name;
  if(tab==="visits"){
    name="سجل الزيارات - فيزياء 2.csv";
    lines=[["الوقت","الحدث","الاسم","النوع","الجهاز","الشاشة","رقم الزائر","التفاصيل","المتصفح"]];
    data.visits.forEach(v=>lines.push([fmt(v.created_at),EVENTS[v.event]||v.event,v.name,v.mode,device(v.user_agent),v.screen,v.visitor_id,JSON.stringify(v.details||""),v.user_agent]));
  }else if(tab==="students"){
    name="ملخص الطلاب - فيزياء 2.csv";
    lines=[["الطالب","المحاولات","الإتقان %","الصحيحة","عدد الأسئلة","أفضل نتيجة %","آخر محاولة","المستوى",...keys.map(k=>TOPICS[k]+" %")]];
    students().forEach(s=>lines.push([s.name,s.n,s.pct,s.c,s.t,s.best,fmt(s.last.created_at),level(s.pct),...keys.map(k=>{const t=s.topics[k];return t&&t.n?Math.round(t.c/t.n*100):""})]));
  }else{
    name="محاولات الطلاب - فيزياء 2.csv";
    lines=[["الاسم","التاريخ","الوحدات","الإجابات الصحيحة","عدد الأسئلة","نسبة الإتقان %","المستوى",...keys.map(k=>TOPICS[k]+" %")]];
    data.attempts.forEach(a=>lines.push([a.name,fmt(a.created_at),units(a.units),a.correct,a.total,a.pct,level(a.pct),...keys.map(k=>{const t=a.by_topic&&a.by_topic[k];return t&&t.n?Math.round(t.c/t.n*100):""})]));
  }
  const text="﻿"+lines.map(r=>r.map(e).join(",")).join("\r\n");
  const url=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
}

function show(){
  const ok=!!API;
  $("setupMsg").hidden=ok;
  $("login").hidden=!ok||!!session;
  $("dash").hidden=!ok||!session;
  if(ok&&session)load();
}
$("loginForm").onsubmit=async ev=>{
  ev.preventDefault();const m=$("loginMsg");m.className="msg";m.textContent="";$("loginBtn").disabled=true;
  const pass=$("pass").value;
  try{data=await fetchData(pass);storeSession(pass);$("pass").value="";show();}
  catch(e){m.className="msg bad";m.textContent=e.message==="auth"?"كلمة المرور غير صحيحة.":"تعذّر الاتصال بالخادم: "+e.message;}
  finally{$("loginBtn").disabled=false;}
};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render();});
$("q").oninput=render;
$("refresh").onclick=load;
$("csv").onclick=csv;
$("logout").onclick=()=>{storeSession(null);data={attempts:[],visits:[]};show();};
session=loadSession();show();
</script>
</body>
</html>
